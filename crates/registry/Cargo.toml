[package]
name = "argus-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No dependency on `argus-session`: the registry is generic over the live
# handle it stores, which keeps it below the session layer in the dependency
# graph and testable without spawning anything.
[dependencies]
argus-reducer = { path = "../reducer", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
argus-reducer = { path = "../reducer", features = ["serde"] }
serde_json.workspace = true
