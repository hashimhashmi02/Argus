[package]
name = "argus-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
argus-manifest = { path = "../manifest" }
argus-pty = { path = "../pty" }
argus-reducer = { path = "../reducer" }
argus-terminal-emu = { path = "../terminal-emu" }
# "sync" for the channels the session is built out of, "time" for the tick that
# keeps debounce timers advancing while a child is silent, and "rt" because the
# session is a task. "macros" is for `select!`.
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
# A fresh conversation id for agents whose manifest uses `{session_uuid}`.
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
