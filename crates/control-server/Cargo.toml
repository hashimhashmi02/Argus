[package]
name = "argus-control-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
argus-protocol = { path = "../protocol" }
thiserror.workspace = true
# "net" carries tokio's Windows named pipes. "io-util" for read/write on them,
# "time" for the client's busy-pipe retry, "macros" for `select!`.
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
