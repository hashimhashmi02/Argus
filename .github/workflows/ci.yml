# Build, lint and test on every push and pull request.
#
# All three platforms must pass. Linux and macOS were added before the port, as
# `continue-on-error` jobs, so the port had something to make pass rather than
# being declared finished on a machine nobody tested. That flag is gone: it was
# a gauge, and a job that cannot fail is a job nobody reads.
#
# What each job runs differs on purpose. Formatting is one answer everywhere, so
# only Windows checks it. Clippy is not: `#[cfg(unix)]` code is invisible to a
# Windows lint, and the port added a good deal of it, so every platform lints
# its own.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces on a machine nobody can attach a debugger to.
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml asks for the MSVC target, which is meaningless
      # here. Overriding the file keeps these runners from fetching a Windows
      # target they cannot use.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup override set stable

      - uses: Swatinem/rust-cache@v2

      # The desktop app needs a system webview, which is a separate problem
      # from the engine being portable. Excluded here and added when the port
      # reaches it.
      - name: Clippy
        run: cargo clippy --workspace --exclude argus-app --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude argus-app
