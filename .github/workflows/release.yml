# Builds the Windows release zip on every version tag and publishes it, with
# its SHA256SUMS, as a GitHub release -- which is what install.ps1 downloads.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run by hand (workflow_dispatch), or on a pull request that touches the
# packaging, it builds the zip as a workflow artifact without publishing
# anything, to try a release before tagging one.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.ps1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String Cargo.toml '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match the workspace version $version in Cargo.toml"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The toolchain itself comes from rust-toolchain.toml on the first cargo
      # call; this only keeps the build directory between runs.
      - uses: Swatinem/rust-cache@v2

      - name: Build the release zip
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: argus-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist/*.zip).FullName
          gh release create "${{ github.ref_name }}" $zip dist/SHA256SUMS `
            --title "Argus ${{ github.ref_name }}" --generate-notes
